services:
  - type: web
    name: kerala-ai-police
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kerala-ai-police-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ANPR_SERVICE_URL
        value: ""

databases:
  - name: kerala-ai-police-db
    databaseName: kerala_ai_police
    region: singapore
    plan: free
